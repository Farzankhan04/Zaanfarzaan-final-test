<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Comments — Admin</title>
<style>
:root{--bg:#151515;--card:#1d1d1d;--line:rgba(220,220,214,.25);--text:#f2f1ec;--mute:#9c9c95;--gold:#dcdcd6;--ok:#9fd3a6;--bad:#e3a0a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Nastaliq Urdu",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:1.2rem 1rem 4rem}
h1{font-size:1.35rem;margin:.4rem 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 .9rem}
input[type=email]{width:100%;padding:.7rem .8rem;border-radius:8px;border:1px solid var(--line);background:#101010;color:var(--text);font-size:1rem}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:.55rem 1rem;min-height:42px}
button.primary{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:700}
button.ok{border-color:var(--ok);color:var(--ok)} button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tabs{display:flex;gap:.5rem;margin:.2rem 0 1rem;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:700}
.meta{color:var(--mute);font-size:.82rem;margin-bottom:.35rem}
.meta a{color:var(--gold)}
.body{white-space:pre-wrap;word-wrap:break-word;font-size:1.02rem;margin:.2rem 0 .8rem}
.msg{color:var(--mute);margin:.5rem 0}.err{color:var(--bad)}
.who{color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Comments — Admin</h1>
  <div id="app"><p class="msg">Loading…</p></div>
</main>
<script>
(function(){
  var SB_URL = 'https://silqtikgdywjzebdehai.supabase.co';
  var SB_KEY = 'sb_publishable_2GYkJE2I5Qtl2eSbDFcDvg_JI9Ha4t5';
  var ADMIN  = 'zaanfarzaan1@gmail.com';
  var KEY = 'zf-admin-session';
  var app = document.getElementById('app');
  var session = null, all = [], tab = 'pending';

  function loadSess(){ try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return null; } }
  function saveSess(s){ try{ if(s) localStorage.setItem(KEY, JSON.stringify(s)); else localStorage.removeItem(KEY); }catch(e){} }
  function el(tag, props, kids){ var e = document.createElement(tag); for(var k in (props||{})){ if(k === 'text') e.textContent = props[k]; else if(k === 'class') e.className = props[k]; else e.setAttribute(k, props[k]); }
    (kids||[]).forEach(function(c){ e.appendChild(c); }); return e; }

  // magic link comes back as  #access_token=...&refresh_token=...&expires_in=3600
  function fromHash(){
    if(location.hash.indexOf('access_token=') < 0) return null;
    var p = new URLSearchParams(location.hash.slice(1));
    var s = {access_token: p.get('access_token'), refresh_token: p.get('refresh_token'),
             expires_at: Math.floor(Date.now()/1000) + parseInt(p.get('expires_in') || '3600', 10)};
    history.replaceState(null, '', location.pathname);
    return s.access_token ? s : null;
  }
  function authFetch(path, opts){
    opts = opts || {}; opts.headers = Object.assign({'apikey': SB_KEY, 'Authorization': 'Bearer ' + session.access_token}, opts.headers || {});
    return fetch(SB_URL + path, opts);
  }
  function refresh(){
    return fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{'apikey': SB_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})}).then(function(r){ if(!r.ok) throw new Error('refresh'); return r.json(); })
      .then(function(j){ session = {access_token: j.access_token, refresh_token: j.refresh_token || session.refresh_token, expires_at: Math.floor(Date.now()/1000) + (j.expires_in || 3600)}; saveSess(session); });
  }
  function ensureFresh(){
    if(session.expires_at - 60 > Date.now()/1000) return Promise.resolve();
    return refresh();
  }
  function whoami(){
    return authFetch('/auth/v1/user').then(function(r){ if(!r.ok) throw new Error('user'); return r.json(); }).then(function(u){ return u.email || ''; });
  }

  function showLogin(note){
    app.innerHTML = '';
    var c = el('div', {class:'card'});
    c.appendChild(el('p', {class:'msg', text:'Apna email daalo. Us par login ka link aayega (password nahi).'}));
    var inp = el('input', {type:'email', value:ADMIN, autocomplete:'email'});
    var btn = el('button', {class:'primary', type:'button', text:'Login link bhejo'});
    var out = el('p', {class:'msg'}); if(note){ out.textContent = note; out.className = 'msg err'; }
    btn.addEventListener('click', function(){
      btn.disabled = true; out.className = 'msg'; out.textContent = 'Bhej rahe hain…';
      fetch(SB_URL + '/auth/v1/otp?redirect_to=' + encodeURIComponent(location.origin + location.pathname), {method:'POST',
        headers:{'apikey': SB_KEY, 'Content-Type':'application/json'}, body: JSON.stringify({email: inp.value.trim(), create_user: true})})
        .then(function(r){ if(!r.ok) throw new Error('otp'); out.textContent = 'Link bhej diya. Apna email kholo aur usi phone/browser me link dabao.'; })
        .catch(function(){ out.className = 'msg err'; out.textContent = 'Link nahi ja saka. Thodi der baad fir koshish karo.'; })
        .then(function(){ btn.disabled = false; });
    });
    c.appendChild(inp); c.appendChild(el('div', {class:'row', style:'margin-top:.7rem'}, [btn])); c.appendChild(out);
    app.appendChild(c);
  }

  function pageLink(page){
    var m = page.match(/^(audio-)?(ghazal|nazm)-(\d+)$/); if(!m) return {href:'#', label:page};
    if(m[1]) return {href:'audios.html#nazm-' + m[3], label:'Audio · ' + m[2] + ' ' + m[3]};
    return {href: m[2] + '-' + m[3] + '.html', label: m[2] + ' ' + m[3]};
  }
  function render(){
    app.innerHTML = '';
    var pend = all.filter(function(c){ return !c.approved; }), appr = all.filter(function(c){ return c.approved; });
    var top = el('div', {class:'row', style:'justify-content:space-between;margin-bottom:.6rem'});
    top.appendChild(el('span', {class:'who', text: ADMIN}));
    var right = el('div', {class:'row'});
    var rb = el('button', {type:'button', text:'Refresh'}); rb.addEventListener('click', reload);
    var lb = el('button', {type:'button', text:'Logout'}); lb.addEventListener('click', function(){ session = null; saveSess(null); showLogin(); });
    right.appendChild(rb); right.appendChild(lb); top.appendChild(right); app.appendChild(top);

    var tabs = el('div', {class:'tabs'});
    [['pending','Pending (' + pend.length + ')'], ['approved','Approved (' + appr.length + ')']].forEach(function(t){
      var b = el('button', {type:'button', text:t[1], 'aria-pressed': tab === t[0] ? 'true' : 'false'});
      b.addEventListener('click', function(){ tab = t[0]; render(); }); tabs.appendChild(b);
    });
    app.appendChild(tabs);

    var list = tab === 'pending' ? pend : appr;
    if(!list.length) app.appendChild(el('p', {class:'msg', text: tab === 'pending' ? 'Koi pending comment nahi.' : 'Abhi koi approved comment nahi.'}));
    list.forEach(function(c){
      var card = el('div', {class:'card'});
      var pl = pageLink(c.page), meta = el('div', {class:'meta'});
      meta.appendChild(el('a', {href: pl.href, target:'_blank', rel:'noopener', text: pl.label}));
      meta.appendChild(document.createTextNode(' · ' + new Date(c.created_at).toLocaleString()));
      card.appendChild(meta);
      card.appendChild(el('div', {class:'meta', dir:'auto', text:'— ' + c.name}));
      card.appendChild(el('div', {class:'body', dir:'auto', text: c.body}));
      var row = el('div', {class:'row'});
      if(!c.approved){ var a = el('button', {type:'button', class:'ok', text:'Approve'}); a.addEventListener('click', function(){ act(c, 'approve', a); }); row.appendChild(a); }
      else { var u = el('button', {type:'button', text:'Wapas pending'}); u.addEventListener('click', function(){ act(c, 'unapprove', u); }); row.appendChild(u); }
      var d = el('button', {type:'button', class:'bad', text:'Delete'}); d.addEventListener('click', function(){ if(confirm('Ye comment hamesha ke liye delete karna hai?')) act(c, 'delete', d); }); row.appendChild(d);
      card.appendChild(row); app.appendChild(card);
    });
  }
  function act(c, what, btn){
    btn.disabled = true;
    ensureFresh().then(function(){
      var path = '/rest/v1/comments?id=eq.' + encodeURIComponent(c.id);
      var o = what === 'delete' ? {method:'DELETE', headers:{'Prefer':'return=representation'}}
        : {method:'PATCH', headers:{'Content-Type':'application/json','Prefer':'return=representation'}, body: JSON.stringify({approved: what === 'approve'})};
      return authFetch(path, o);
    }).then(function(r){ if(!r.ok) throw new Error('act'); return r.json(); })
      .then(function(rows){ if(!rows.length) throw new Error('none');
        if(what === 'delete') all = all.filter(function(x){ return x.id !== c.id; }); else c.approved = (what === 'approve'); render(); })
      .catch(function(){ btn.disabled = false; alert('Nahi ho paya. Refresh karke fir koshish karo (shayad login purana ho gaya).'); });
  }
  function reload(){
    app.innerHTML = ''; app.appendChild(el('p', {class:'msg', text:'Loading…'}));
    ensureFresh().then(function(){ return whoami(); }).then(function(email){
      if(email.toLowerCase() !== ADMIN){ session = null; saveSess(null); showLogin('Ye email (' + email + ') admin nahi hai.'); return null; }
      return authFetch('/rest/v1/comments?select=id,created_at,page,name,body,approved&order=created_at.desc&limit=500')
        .then(function(r){ if(!r.ok) throw new Error('load'); return r.json(); }).then(function(rows){ all = rows; render(); });
    }).catch(function(){ session = null; saveSess(null); showLogin('Login purana ho gaya. Dobara login karo.'); });
  }

  session = fromHash() || loadSess();
  if(fromHash && session) saveSess(session);
  if(session) reload(); else showLogin();
})();
</script>
</body>
</html>
