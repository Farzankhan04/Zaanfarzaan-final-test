<script>
const ITEMS = [{"id": "nazm-1","num": 1,"kind": "Nazm · #1","title": "ग़रज़","versesHtml": ["<div class=\"verse nazm-line\">कल इक आदमी मुझ को बस में मिला जो</div>","<div class=\"verse nazm-line\">मुझे देख कर यूँ था हैराँ के जैसे</div>","<div class=\"verse nazm-line\">पुराना कोई यार उसे मिल गया हो</div>","<div class=\"verse nazm-line\">मिरे पास आकर वो बैठा ही था बस</div>","<div class=\"verse nazm-line\">के अगले ही पल मुस्कुरा कर वो कहता</div>","<div class=\"verse nazm-line\">मियाँ और क्या हाल सब ख़ैरियत है</div>","<div class=\"verse nazm-line\">मैं अनजान उस शख़्स से क्या ही कहता</div>","<div class=\"verse nazm-line\">के मैं तो उसे जानता ही नहीं था</div>","<div class=\"verse nazm-line\">बहुत ज़ोर फिर ज़ेहन पर मैं ने डाला</div>","<div class=\"verse nazm-line\">मुझे पर वो चेहरा कहाँ याद आया</div>","<div class=\"verse nazm-line\">सो मैं ने फिर उस से ही पूछा बिल-आख़िर</div>","<div class=\"verse nazm-line\">के भाई तू क्या मुझ से पहले मिला है</div>","<div class=\"verse nazm-line\">मिला हो अगर तो बता क्यों कि मुझ को</div>","<div class=\"verse nazm-line\">नहीं आ रहा याद तेरा ये चेहरा</div>","<div class=\"verse nazm-line\">ये सुन के वो ज़ोरों से हँसने लगा और</div>","<div class=\"verse nazm-line\">बड़े तंज़िया लहजे में बोल उठ्ठा</div>","<div class=\"verse nazm-line\">मियाँ ख़ैरियत पूछने के लिए भी</div>","<div class=\"verse nazm-line\">हमें जानना होगा इक दूसरे को</div>","<div class=\"verse nazm-line\">हम इक दूसरे को नहीं जानते हैं</div>","<div class=\"verse nazm-line\">मियाँ आप थोड़े परेशाँ दिखे थे</div>","<div class=\"verse nazm-line\">सो बस आपका हाल पूछा था यूँ ही</div>","<div class=\"verse nazm-line\">ये सुन के तो मानो नदामत से फ़ौरन</div>","<div class=\"verse nazm-line\">कहा उस से मैं ने के हाँ ठीक हूँ मैं</div>","<div class=\"verse nazm-line\">फिर उस की भी उस से ज़रा ख़ैरियत ली</div>","<div class=\"verse nazm-line\">और इस गुफ़्तुगू को किया ख़त्म मैं ने</div>","<div class=\"verse nazm-line\">मगर मन ही मन में मैं इस गुफ़्तुगू को</div>","<div class=\"verse nazm-line\">बहुत देर तक सोचता ही रहा बस</div>","<div class=\"verse nazm-line\">के जितनी बुरी मैं समझता था दुनिया</div>","<div class=\"verse nazm-line\">ये दुनिया तो उतनी बुरी भी नहीं है</div>","<div class=\"verse nazm-line\">यहाँ कुछ भले लोग अभी भी बचे हैं</div>","<div class=\"verse nazm-line\">जो यूँ बे-ग़रज़ ख़ैरियत पूछते हैं</div>","<div class=\"verse nazm-line\">और इस ख़ूब-सूरत नज़रिए को दिल में</div>","<div class=\"verse nazm-line\">बसाने ही मैं जा रहा था के यक-दम</div>","<div class=\"verse nazm-line\">बड़े नर्म लहजे में वो शख़्स बोला</div>","<div class=\"verse nazm-line\">मियाँ आप अपना ज़रा नेट देंगे</div>","<div class=\"verse nazm-line\">मिरा नेट शायद नहीं चल रहा और</div>","<div class=\"verse nazm-line\">मुझे इक अहम काम करना है अपना</div>","<div class=\"verse nazm-line\">ये सुन के उसे नेट तो दे दिया पर</div>","<div class=\"verse nazm-line\">कहा मुस्कुराते हुए मैं ने मन में</div>","<div class=\"verse nazm-line\">सही सोचता था मैं दुनिया के बारे</div>"],"versesHtmlEn": ["<div class=\"verse nazm-line\">Kal ik aadmi mujh ko bus mein mila jo</div>","<div class=\"verse nazm-line\">Mujhe dekh kar yun tha hairaan ke jaise</div>","<div class=\"verse nazm-line\">Puraana koi yaar use mil gaya ho</div>","<div class=\"verse nazm-line\">Mire paas aakar wo baitha hi tha bas</div>","<div class=\"verse nazm-line\">Ke agle hi pal muskura kar wo kahta</div>","<div class=\"verse nazm-line\">Miyaan aur kya haal sab khairiyat hai</div>","<div class=\"verse nazm-line\">Main anjaan us shakhs se kya hi kahta</div>","<div class=\"verse nazm-line\">Ke main to use jaanta hi nahin tha</div>","<div class=\"verse nazm-line\">Bahut zor phir zehan par main ne daala</div>","<div class=\"verse nazm-line\">Mujhe par wo chehra kahaan yaad aaya</div>","<div class=\"verse nazm-line\">So main ne phir us se hi poochha bil-aakhir</div>","<div class=\"verse nazm-line\">Ke bhai tu kya mujh se pahle mila hai</div>","<div class=\"verse nazm-line\">Mila ho agar to bata kyon ki mujh ko</div>","<div class=\"verse nazm-line\">Nahin aa raha yaad tera ye chehra</div>","<div class=\"verse nazm-line\">Ye sun ke wo zoron se hansne laga aur</div>","<div class=\"verse nazm-line\">Bade tanziya lahje mein bol uttha</div>","<div class=\"verse nazm-line\">Miyaan khairiyat poochhne ke liye bhi</div>","<div class=\"verse nazm-line\">Hamen jaanna hoga ik dusre ko</div>","<div class=\"verse nazm-line\">Hum ik dusre ko nahin jaante hain</div>","<div class=\"verse nazm-line\">Miyaan aap thode pareshaan dikhe the</div>","<div class=\"verse nazm-line\">So bas aapka haal poochha tha yun hi</div>","<div class=\"verse nazm-line\">Ye sun ke to maano nadaamat se fauran</div>","<div class=\"verse nazm-line\">Kaha us se main ne ke haan theek hun main</div>","<div class=\"verse nazm-line\">Phir us ki bhi us se zara khairiyat li</div>","<div class=\"verse nazm-line\">Aur is guftugu ko kiya khatm main ne</div>","<div class=\"verse nazm-line\">Magar man hi man mein main is guftugu ko</div>","<div class=\"verse nazm-line\">Bahut der tak sochta hi raha bas</div>","<div class=\"verse nazm-line\">Ke jitni buri main samajhta tha duniya</div>","<div class=\"verse nazm-line\">Ye duniya to utni buri bhi nahin hai</div>","<div class=\"verse nazm-line\">Yahaan kuchh bhale log abhi bhi bache hain</div>","<div class=\"verse nazm-line\">Jo yun be-gharaz khairiyat poochhte hain</div>","<div class=\"verse nazm-line\">Aur is khoob-soorat nazariye ko dil mein</div>","<div class=\"verse nazm-line\">Basaane hi main ja raha tha ke yak-dam</div>","<div class=\"verse nazm-line\">Bade narm lahje mein wo shakhs bola</div>","<div class=\"verse nazm-line\">Miyaan aap apna zara net denge</div>","<div class=\"verse nazm-line\">Mira net shaayad nahin chal raha aur</div>","<div class=\"verse nazm-line\">Mujhe ik aham kaam karna hai apna</div>","<div class=\"verse nazm-line\">Ye sun ke use net to de diya par</div>","<div class=\"verse nazm-line\">Kaha muskuraate hue main ne man mein</div>","<div class=\"verse nazm-line\">Sahi sochta tha main duniya ke baare</div>"],"titleEn": "Gharaz"},{"id": "nazm-2","num": 2,"kind": "Nazm · #2","title": "जगह","versesHtml": ["<div class=\"verse nazm-line\">खचा-खच यात्रियों से वो भरी बस</div>","<div class=\"verse nazm-line\">जब इक स्टॉप पर पहुँची</div>","<div class=\"verse nazm-line\">रुकी आहिस्ता से और फिर</div>","<div class=\"verse nazm-line\">बड़ी मुश्किल से दरवाज़ा खुला उस का</div>","<div class=\"verse nazm-line\">थे जितने लोग बाहर मुंतज़िर थे सब उसी बस के</div>","<div class=\"verse nazm-line\">मगर वो लोग अंदर ही नहीं आए</div>","<div class=\"verse nazm-line\">और आते भी वो कैसे ही कि अंदर तो</div>","<div class=\"verse nazm-line\">खड़े होने की कोई जगह बाक़ी थी</div>","<div class=\"verse nazm-line\">न कोई सीट ख़ाली थी जहाँ पर बैठता कोई</div>","<div class=\"verse nazm-line\">और ऊपर से जो अंदर लोग थे चिल्ला रहे थे</div>","<div class=\"verse nazm-line\">की अंदर कोई मत आना नहीं है याँ जगह बिलकुल</div>","<div class=\"verse nazm-line\">मगर इक आदमी कुछ यूँ था बे-परवा</div>","<div class=\"verse nazm-line\">लगा कहने पकड़ कर बस का दरवाज़ा</div>","<div class=\"verse nazm-line\">अरे थोड़ा सरक जाओ जगह तो ख़ूब है अंदर</div>","<div class=\"verse nazm-line\">और ऐसा कहते ही जबरन वो घुस आया</div>","<div class=\"verse nazm-line\">बड़ी दिक्कत हुई सब को मगर वो आदमी ख़ुश था</div>","<div class=\"verse nazm-line\">कि कम-अज़-कम जगह तो मिल गई उस को</div>","<div class=\"verse nazm-line\">मगर फिर अगले ही स्टॉप पर जब बस रुकी फिर से</div>","<div class=\"verse nazm-line\">खुला फिर से वो दरवाज़ा</div>","<div class=\"verse nazm-line\">और इस बार और मुश्किल से</div>","<div class=\"verse nazm-line\">तो जितने लोग अंदर थे वो फिर इस बार चिल्लाए</div>","<div class=\"verse nazm-line\">की अंदर कोई मत आना नहीं है याँ जगह बिलकुल</div>","<div class=\"verse nazm-line\">और अब वो आदमी भी साथ में चिल्ला रहा था</div>","<div class=\"verse nazm-line\">वही इक आदमी जो पिछले ही स्टॉप पर जबरन</div>","<div class=\"verse nazm-line\">सभी लोगों के चिल्लाने से बे-परवा</div>","<div class=\"verse nazm-line\">जगह की खोज में अंदर घुस आया था</div>"],"versesHtmlEn": ["<div class=\"verse nazm-line\">Khacha-khach yaatriyon se wo bhari bus</div>","<div class=\"verse nazm-line\">Jab ik stop par pahunchi</div>","<div class=\"verse nazm-line\">Ruki aahista se aur phir</div>","<div class=\"verse nazm-line\">Badi mushkil se darwaaza khula us ka</div>","<div class=\"verse nazm-line\">The jitne log baahar muntazir the sab usi bus ke</div>","<div class=\"verse nazm-line\">Magar wo log andar hi nahin aae</div>","<div class=\"verse nazm-line\">Aur aate bhi wo kaise hi ki andar to</div>","<div class=\"verse nazm-line\">Khade hone ki koi jagah baaqi thi</div>","<div class=\"verse nazm-line\">Na koi seat khaali thi jahaan par baithta koi</div>","<div class=\"verse nazm-line\">Aur upar se jo andar log the chilla rahe the</div>","<div class=\"verse nazm-line\">Ki andar koi mat aana nahin hai yaan jagah bilkul</div>","<div class=\"verse nazm-line\">Magar ik aadmi kuchh yun tha be-parwa</div>","<div class=\"verse nazm-line\">Laga kahne pakad kar bus ka darwaaza</div>","<div class=\"verse nazm-line\">Are thoda sarak jaao jagah to khoob hai andar</div>","<div class=\"verse nazm-line\">Aur aisa kahte hi jabran wo ghus aaya</div>","<div class=\"verse nazm-line\">Badi dikkat hui sab ko magar wo aadmi khush tha</div>","<div class=\"verse nazm-line\">Ki kam-az-kam jagah to mil gai us ko</div>","<div class=\"verse nazm-line\">Magar phir agle hi stop par jab bus ruki phir se</div>","<div class=\"verse nazm-line\">Khula phir se wo darwaaza</div>","<div class=\"verse nazm-line\">Aur is baar aur mushkil se</div>","<div class=\"verse nazm-line\">To jitne log andar the wo phir is baar chillaae</div>","<div class=\"verse nazm-line\">Ki andar koi mat aana nahin hai yaan jagah bilkul</div>","<div class=\"verse nazm-line\">Aur ab wo aadmi bhi saath mein chilla raha tha</div>","<div class=\"verse nazm-line\">Wahi ik aadmi jo pichhle hi stop par jabran</div>","<div class=\"verse nazm-line\">Sabhi logon ke chillaane se be-parwa</div>","<div class=\"verse nazm-line\">Jagah ki khoj mein andar ghus aaya tha</div>"],"titleEn": "Jagah"},{"id": "nazm-3","num": 3,"kind": "Nazm · #3","title": "मैं ला-परवा अभी भी हूँ","versesHtml": ["<div class=\"verse nazm-line\">जो बचपन में कहा करती थी माँ मेरी</div>","<div class=\"verse nazm-line\">जो शायद इक हक़ीक़त थी</div>","<div class=\"verse nazm-line\">मुझे वो याद है अब भी</div>","<div class=\"verse nazm-line\">कि मैं हर चीज़ को बस तोड़ देता हूँ</div>","<div class=\"verse nazm-line\">न जाने क्यूँ किसी भी चीज़ की परवा नहीं करता</div>","<div class=\"verse nazm-line\">ये सच ही था</div>","<div class=\"verse nazm-line\">खिलौने हों कि जूते हों कि चप्पल हो</div>","<div class=\"verse nazm-line\">कि हो पानी की बोतल या टिफ़िन ही हो</div>","<div class=\"verse nazm-line\">कि हो स्कूल का बस्ता या हो ज्योमेट्री का बॉक्स</div>","<div class=\"verse nazm-line\">नए आते थे और मैं कुछ ही दिन में तोड़ देता था</div>","<div class=\"verse nazm-line\">था मैं तब से ही लापरवा</div>","<div class=\"verse nazm-line\">मिरी आदत थी ये शायद</div>","<div class=\"verse nazm-line\">बड़ा तो हो गया मैं पर ये इक आदत नहीं बदली</div>","<div class=\"verse nazm-line\">फ़क़त बदली हैं चीज़ें टूटने वाली</div>","<div class=\"verse nazm-line\">कि तब जो टूट जाती थीं वो चीज़ें अब सलामत हैं</div>","<div class=\"verse nazm-line\">मगर अब कुछ नई चीज़ें हैं जिनको तोड़ता हूँ मैं</div>","<div class=\"verse nazm-line\">मिरी आदत कहाँ ही छोड़ता हूँ मैं</div>","<div class=\"verse nazm-line\">किसी से दोस्ती कितनी ही हो कितना ही रिश्ता हो</div>","<div class=\"verse nazm-line\">किसी की आस मुझ से हो या हो मुझ से उमीदें ही</div>","<div class=\"verse nazm-line\">मिरा ख़ुद से किया वादा हो या फिर हों मिरे सपने</div>","<div class=\"verse nazm-line\">मिरे दिल में पले अरमान हों या हो मिरा ये दिल</div>","<div class=\"verse nazm-line\">मैं सब कुछ तोड़ देता हूँ न जाने क्यूँ</div>","<div class=\"verse nazm-line\">नहीं मालूम ये ताकत है मेरी या है कमज़ोरी</div>","<div class=\"verse nazm-line\">मगर ख़ैर अब करूँगा जान कर क्या ही</div>","<div class=\"verse nazm-line\">मुझे इतना पता है बस कि हाँ शायद</div>","<div class=\"verse nazm-line\">मैं लापरवा अभी भी हूँ</div>"],"versesHtmlEn": ["<div class=\"verse nazm-line\">Jo bachpan mein kaha karti thi maan meri</div>","<div class=\"verse nazm-line\">Jo shaayad ik haqeeqat thi</div>","<div class=\"verse nazm-line\">Mujhe wo yaad hai ab bhi</div>","<div class=\"verse nazm-line\">Ki main har cheez ko bas tod deta hun</div>","<div class=\"verse nazm-line\">Na jaane kyun kisi bhi cheez ki parwa nahin karta</div>","<div class=\"verse nazm-line\">Ye sach hi tha</div>","<div class=\"verse nazm-line\">Khilaune hon ki joote hon ki chappal ho</div>","<div class=\"verse nazm-line\">Ki ho paani ki botal ya tiffin hi ho</div>","<div class=\"verse nazm-line\">Ki ho school ka basta ya ho geometry ka box</div>","<div class=\"verse nazm-line\">Nae aate the aur main kuchh hi din mein tod deta tha</div>","<div class=\"verse nazm-line\">Tha main tab se hi laaparwa</div>","<div class=\"verse nazm-line\">Miri aadat thi ye shaayad</div>","<div class=\"verse nazm-line\">Bada to ho gaya main par ye ik aadat nahin badli</div>","<div class=\"verse nazm-line\">Faqat badli hain cheezen tootne waali</div>","<div class=\"verse nazm-line\">Ki tab jo toot jaati thin wo cheezen ab salaamat hain</div>","<div class=\"verse nazm-line\">Magar ab kuchh nai cheezen hain jinko todta hun main</div>","<div class=\"verse nazm-line\">Miri aadat kahaan hi chhodta hun main</div>","<div class=\"verse nazm-line\">Kisi se dosti kitni hi ho kitna hi rishta ho</div>","<div class=\"verse nazm-line\">Kisi ki aas mujh se ho ya ho mujh se umeeden hi</div>","<div class=\"verse nazm-line\">Mira khud se kiya waada ho ya phir hon mire sapne</div>","<div class=\"verse nazm-line\">Mire dil mein pale armaan hon ya ho mira ye dil</div>","<div class=\"verse nazm-line\">Main sab kuchh tod deta hun na jaane kyun</div>","<div class=\"verse nazm-line\">Nahin maaloom ye taakat hai meri ya hai kamzori</div>","<div class=\"verse nazm-line\">Magar khair ab karunga jaan kar kya hi</div>","<div class=\"verse nazm-line\">Mujhe itna pata hai bas ki haan shaayad</div>","<div class=\"verse nazm-line\">Main laaparwa abhi bhi hun</div>"],"titleEn": "Main La-parwa Abhi Bhi Hun"},{"id": "nazm-4","num": 4,"kind": "Nazm · #4","title": "कमाल आदमी हो","versesHtml": ["<div class=\"verse nazm-line\">कमाल आदमी हो</div>","<div class=\"verse nazm-line\">मोहब्बत करी जब किसी से</div>","<div class=\"verse nazm-line\">तो बस इस क़दर की</div>","<div class=\"verse nazm-line\">के उस शख़्स के वास्ते फिर</div>","<div class=\"verse nazm-line\">ये दोनों जहाँ छोड़ डाले</div>","<div class=\"verse nazm-line\">मगर जब भी रक्खी अदावत किसी से</div>","<div class=\"verse nazm-line\">तो इस दर्जा रक्खी</div>","<div class=\"verse nazm-line\">के अगले को मानो</div>","<div class=\"verse nazm-line\">कहीं का न छोड़ा</div>"],"versesHtmlEn": ["<div class=\"verse nazm-line\">Kamaal aadmi ho</div>","<div class=\"verse nazm-line\">Mohabbat kari jab kisi se</div>","<div class=\"verse nazm-line\">To bas is qadar ki</div>","<div class=\"verse nazm-line\">Ke us shakhs ke waaste phir</div>","<div class=\"verse nazm-line\">Ye donon jahaan chhod daale</div>","<div class=\"verse nazm-line\">Magar jab bhi rakkhi adaawat kisi se</div>","<div class=\"verse nazm-line\">To is darja rakkhi</div>","<div class=\"verse nazm-line\">Ke agle ko maano</div>","<div class=\"verse nazm-line\">Kahin ka na chhoda</div>"],"titleEn": "Kamaal Aadmi Ho"},{"id": "nazm-5","num": 5,"kind": "Nazm · #5","title": "सुन मेरे ऐ प्यारे रब","versesHtml": ["<div class=\"verse nazm-line\">सुन मेरे ऐ प्यारे रब</div>","<div class=\"verse nazm-line\">सारी मुश्किल कर दे हल</div>","<div class=\"verse nazm-line\">तू तो वाक़िफ़ है कैसे</div>","<div class=\"verse nazm-line\">कटता है मेरा हर पल</div>","<div class=\"verse nazm-line\">फ़िक्र-ए-फ़र्दा या तंगी</div>","<div class=\"verse nazm-line\">ज़ख़्म-ए-दिल या मजबूरी</div>","<div class=\"verse nazm-line\">मुश्किल मुश्किल हर-सू है</div>","<div class=\"verse nazm-line\">कितनी क़िस्में हैं इस की</div>","<div class=\"verse nazm-line\">माना इन सब के पीछे</div>","<div class=\"verse nazm-line\">कुछ तो बेहतर ही होगा</div>","<div class=\"verse nazm-line\">मेरी भी ख़ातिर तू ने</div>","<div class=\"verse nazm-line\">कुछ है बेहतर ही सोचा</div>","<div class=\"verse nazm-line\">पर फिर भी घबराए जी</div>","<div class=\"verse nazm-line\">जब सोचूँ मैं मुस्तक़बिल</div>","<div class=\"verse nazm-line\">आँखें हो जाती है नम</div>","<div class=\"verse nazm-line\">अंदर से जलता है दिल</div>","<div class=\"verse nazm-line\">चारो जानिब तारीकी</div>","<div class=\"verse nazm-line\">दिखती है मुझ को जब जब</div>","<div class=\"verse nazm-line\">दिल तब तब ये कहता है</div>","<div class=\"verse nazm-line\">सुन मेरे ऐ प्यारे रब</div>"],"versesHtmlEn": ["<div class=\"verse nazm-line\">Sun mere ai pyaare rab</div>","<div class=\"verse nazm-line\">Saari mushkil kar de hal</div>","<div class=\"verse nazm-line\">Tu to waaqif hai kaise</div>","<div class=\"verse nazm-line\">Katta hai mera har pal</div>","<div class=\"verse nazm-line\">Fikr-e-farda ya tangi</div>","<div class=\"verse nazm-line\">Zakhm-e-dil ya majboori</div>","<div class=\"verse nazm-line\">Mushkil mushkil har-soo hai</div>","<div class=\"verse nazm-line\">Kitni qismen hain is ki</div>","<div class=\"verse nazm-line\">Maana in sab ke peechhe</div>","<div class=\"verse nazm-line\">Kuchh to behatar hi hoga</div>","<div class=\"verse nazm-line\">Meri bhi khaatir tu ne</div>","<div class=\"verse nazm-line\">Kuchh hai behatar hi socha</div>","<div class=\"verse nazm-line\">Par phir bhi ghabraae ji</div>","<div class=\"verse nazm-line\">Jab sochun main mustaqbil</div>","<div class=\"verse nazm-line\">Aankhen ho jaati hai nam</div>","<div class=\"verse nazm-line\">Andar se jalta hai dil</div>","<div class=\"verse nazm-line\">Chaaro jaanib taareeki</div>","<div class=\"verse nazm-line\">Dikhti hai mujh ko jab jab</div>","<div class=\"verse nazm-line\">Dil tab tab ye kahta hai</div>","<div class=\"verse nazm-line\">Sun mere ai pyaare rab</div>"],"titleEn": "Sun Mere Ai Pyaare Rab"},{"id": "nazm-6","num": 6,"kind": "Nazm · #6","title": "आदत","versesHtml": ["<div class=\"verse nazm-line\">कभी जब सोचता हूँ क्या करूँगा बिन तिरे</div>","<div class=\"verse nazm-line\">मुझे अफ़्सुर्दगी महसूस होती है बहुत</div>","<div class=\"verse nazm-line\">कि तुझ से पेश्तर तो बस सियह थी ज़िंदगी</div>","<div class=\"verse nazm-line\">तिरी आमद ने मानो रंग इस में भर दिए</div>","<div class=\"verse nazm-line\">कि अब हर बात को जज़्बात को हालात को</div>","<div class=\"verse nazm-line\">मिरी हर फ़िक्र को हर दर्द को हर रंज को</div>","<div class=\"verse nazm-line\">मिरी इस बे-बसी या बे-कली या तैश को</div>","<div class=\"verse nazm-line\">मिरे हर ग़म को और उन से मिली हर आह को</div>","<div class=\"verse nazm-line\">मिरे हर ज़ख़्म और उन से मिले हर दाग़ को</div>","<div class=\"verse nazm-line\">मिरी इस ज़िंदगी में पड़ रही उफ़ताद को</div>","<div class=\"verse nazm-line\">समझने के लिए तू है मुयस्सर आज तो</div>","<div class=\"verse nazm-line\">मगर कल का नहीं मालूम मुझ को क्या करूँ</div>","<div class=\"verse nazm-line\">अगर तू कल नहीं होगा ख़ुदा-ना-ख़्वास्ता</div>","<div class=\"verse nazm-line\">ये सब फिर कौन समझेगा मुझे बतला ज़रा</div>","<div class=\"verse nazm-line\">ख़याल आता है ये जब भी मुझे तो यूँ लगे</div>","<div class=\"verse nazm-line\">कि गोया चीर ही देगा ये अब सीना मिरा</div>","<div class=\"verse nazm-line\">भला कैसे जियूँगा बिन तिरे ये ज़िंदगी</div>","<div class=\"verse nazm-line\">तू वो आदत है जो मैं छोड़ सकता ही नहीं</div>"],"versesHtmlEn": ["<div class=\"verse nazm-line\">Kabhi jab sochta hun kya karunga bin tire</div>","<div class=\"verse nazm-line\">Mujhe afsurdagi mahsoos hoti hai bahut</div>","<div class=\"verse nazm-line\">Ki tujh se peshtar to bas siyah thi zindagi</div>","<div class=\"verse nazm-line\">Tiri aamad ne maano rang is mein bhar diye</div>","<div class=\"verse nazm-line\">Ki ab har baat ko jazbaat ko haalaat ko</div>","<div class=\"verse nazm-line\">Miri har fikr ko har dard ko har ranj ko</div>","<div class=\"verse nazm-line\">Miri is be-basi ya be-kali ya taish ko</div>","<div class=\"verse nazm-line\">Mire har gham ko aur un se mili har aah ko</div>","<div class=\"verse nazm-line\">Mire har zakhm aur un se mile har daagh ko</div>","<div class=\"verse nazm-line\">Miri is zindagi mein pad rahi uftaad ko</div>","<div class=\"verse nazm-line\">Samajhne ke liye tu hai muyassar aaj to</div>","<div class=\"verse nazm-line\">Magar kal ka nahin maaloom mujh ko kya karun</div>","<div class=\"verse nazm-line\">Agar tu kal nahin hoga khuda-na-khwaasta</div>","<div class=\"verse nazm-line\">Ye sab phir kaun samjhega mujhe batla zara</div>","<div class=\"verse nazm-line\">Khayaal aata hai ye jab bhi mujhe to yun lage</div>","<div class=\"verse nazm-line\">Ki goya cheer hi dega ye ab seena mira</div>","<div class=\"verse nazm-line\">Bhala kaise jiyunga bin tire ye zindagi</div>","<div class=\"verse nazm-line\">Tu wo aadat hai jo main chhod sakta hi nahin</div>"],"titleEn": "Aadat"}];
