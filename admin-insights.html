<!DOCTYPE html>
<html lang="hi">
<head>
<script>(function(){var t=null;try{t=localStorage.getItem('zf-theme');}catch(e){}if(t!=='dark')document.documentElement.setAttribute('data-theme','light');})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Insights — Admin</title>
<style>
:root{--bg:#151515;--card:#1d1d1d;--line:rgba(220,220,214,.25);--text:#f2f1ec;--mute:#9c9c95;--gold:#dcdcd6;--ok:#9fd3a6;--bad:#e3a0a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Nastaliq Urdu",sans-serif;line-height:1.6}
main{max-width:820px;margin:0 auto;padding:1.2rem 1rem 4rem}
h1{font-size:1.35rem;margin:.4rem 0 .3rem}h2{font-size:1.02rem;margin:0 0 .55rem;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 .9rem}
input[type=email]{width:100%;padding:.7rem .8rem;border-radius:8px;border:1px solid var(--line);background:#101010;color:var(--text);font-size:1rem}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:.5rem .9rem;min-height:40px}
button.primary{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:700}
button.bad{border-color:var(--bad);color:var(--bad)} button:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tabs{display:flex;gap:.5rem;margin:.6rem 0 1rem;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:700}
.msg{color:var(--mute);margin:.5rem 0}.err{color:var(--bad)}.who{color:var(--mute);font-size:.85rem}.sub{color:var(--mute);font-size:.84rem;margin:.1rem 0 .8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin:0 0 .9rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}.kpi b{display:block;font-size:1.5rem;line-height:1.2}.kpi span{color:var(--mute);font-size:.78rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:start;padding:.38rem .4rem;border-bottom:1px solid rgba(220,220,214,.12);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:.76rem}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}td.k{word-break:break-word}a{color:var(--gold)}
.bar{display:flex;align-items:flex-end;gap:2px;height:64px;margin:.3rem 0 .2rem}.bar i{flex:1;min-width:2px;background:var(--gold);opacity:.75;border-radius:2px 2px 0 0}
.note{color:var(--mute);font-size:.8rem;margin:.6rem 0 0}
</style>
</head>
<body>
<main id="main-content">
  <h1>Insights — Admin</h1>
  <p class="sub">Sirf aap ye dekh sakte ho. Koi naam / email / phone / ID nahi — sirf “kaun sa sher, audio ya lafz kitne visits me use hua”. Ek visit me ek cheez ek hi baar gini jaati hai.</p>
  <div id="app"><p class="msg">Loading…</p></div>
</main>
<script>
(function(){
  var SB_URL = 'https://silqtikgdywjzebdehai.supabase.co';
  var SB_KEY = 'sb_publishable_2GYkJE2I5Qtl2eSbDFcDvg_JI9Ha4t5';
  var ADMIN  = 'zaanfarzaan1@gmail.com';
  var KEY = 'zf-admin-session';            /* the same login as admin-comments.html: logging in on one page logs you in on the other */
  var app = document.getElementById('app');
  var session = null, rows = [], days = 30, loadedAt = null, tableMissing = false;

  function loadSess(){ try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return null; } }
  function saveSess(s){ try{ if(s) localStorage.setItem(KEY, JSON.stringify(s)); else localStorage.removeItem(KEY); }catch(e){} }
  function el(tag, props, kids){ var e = document.createElement(tag); for(var k in (props||{})){ if(k === 'text') e.textContent = props[k]; else if(k === 'class') e.className = props[k]; else e.setAttribute(k, props[k]); }
    (kids||[]).forEach(function(c){ e.appendChild(c); }); return e; }
  function fromHash(){
    if(location.hash.indexOf('access_token=') < 0) return null;
    var p = new URLSearchParams(location.hash.slice(1));
    var s = {access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_at: Math.floor(Date.now()/1000) + parseInt(p.get('expires_in') || '3600', 10)};
    history.replaceState(null, '', location.pathname);
    return s.access_token ? s : null;
  }
  function authFetch(path, opts){
    opts = opts || {}; opts.headers = Object.assign({'apikey': SB_KEY, 'Authorization': 'Bearer ' + session.access_token}, opts.headers || {});
    return fetch(SB_URL + path, opts);
  }
  function refresh(){
    return fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{'apikey': SB_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})}).then(function(r){ if(!r.ok) throw new Error('refresh'); return r.json(); })
      .then(function(j){ session = {access_token: j.access_token, refresh_token: j.refresh_token || session.refresh_token, expires_at: Math.floor(Date.now()/1000) + (j.expires_in || 3600)}; saveSess(session); });
  }
  function ensureFresh(){ if(session.expires_at - 60 > Date.now()/1000) return Promise.resolve(); return refresh(); }
  function whoami(){ return authFetch('/auth/v1/user').then(function(r){ if(!r.ok) throw new Error('user'); return r.json(); }).then(function(u){ return u.email || ''; }); }

  function showLogin(note){
    app.innerHTML = '';
    var c = el('div', {class:'card'});
    c.appendChild(el('p', {class:'msg', text:'Apna email daalo. Us par login ka link aayega (password nahi).'}));
    var inp = el('input', {type:'email', value:ADMIN, autocomplete:'email'});
    var btn = el('button', {class:'primary', type:'button', text:'Login link bhejo'});
    var out = el('p', {class:'msg'}); if(note){ out.textContent = note; out.className = 'msg err'; }
    btn.addEventListener('click', function(){
      btn.disabled = true; out.className = 'msg'; out.textContent = 'Bhej rahe hain…';
      fetch(SB_URL + '/auth/v1/otp?redirect_to=' + encodeURIComponent(location.origin + location.pathname), {method:'POST',
        headers:{'apikey': SB_KEY, 'Content-Type':'application/json'}, body: JSON.stringify({email: inp.value.trim(), create_user: true})})
        .then(function(r){ if(!r.ok) throw new Error('otp'); out.textContent = 'Link bhej diya. Apna email kholo aur usi phone/browser me link dabao.'; })
        .catch(function(){ out.className = 'msg err'; out.textContent = 'Link nahi ja saka. Thodi der baad fir koshish karo.'; })
        .then(function(){ btn.disabled = false; });
    });
    c.appendChild(inp); c.appendChild(el('div', {class:'row', style:'margin-top:.7rem'}, [btn])); c.appendChild(out);
    app.appendChild(c);
  }

  /* ---------- data ---------- */
  function fetchAll(){
    var since = days ? new Date(Date.now() - days * 86400000).toISOString() : null, out = [], page = 0, PAGE = 1000, MAXP = 40;
    function next(){
      var q = '/rest/v1/zf_events?select=kind,key,lang,created_at&order=created_at.desc' + (since ? '&created_at=gte.' + encodeURIComponent(since) : '');
      return authFetch(q, {headers: {'Range-Unit': 'items', 'Range': (page * PAGE) + '-' + (page * PAGE + PAGE - 1)}}).then(function(r){
        if(r.status === 404 || r.status === 400){ tableMissing = true; return []; }
        if(!r.ok && r.status !== 206) throw new Error('load');
        return r.json();
      }).then(function(part){ out = out.concat(part); page++; if(part.length === PAGE && page < MAXP) return next(); });
    }
    tableMissing = false;
    return next().then(function(){ return out; });
  }
  function reload(){
    app.innerHTML = ''; app.appendChild(el('p', {class:'msg', text:'Loading…'}));
    ensureFresh().then(function(){ return whoami(); }).then(function(email){
      if(email.toLowerCase() !== ADMIN){ session = null; saveSess(null); showLogin('Ye email (' + email + ') admin nahi hai.'); return null; }
      return fetchAll().then(function(r){ rows = r; loadedAt = new Date(); render(); });
    }).catch(function(){ session = null; saveSess(null); showLogin('Login purana ho gaya. Dobara login karo.'); });
  }

  /* ---------- helpers ---------- */
  function count(kind){ var m = {}; rows.forEach(function(r){ if(r.kind === kind) m[r.key] = (m[r.key] || 0) + 1; }); return m; }
  function top(m, n){ return Object.keys(m).map(function(k){ return [k, m[k]]; }).sort(function(a, b){ return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); }).slice(0, n); }
  function keyCell(k){
    var td = el('td', {class:'k'});
    if(/^(ghazal|nazm)-\d{1,3}$/.test(k)) td.appendChild(el('a', {href: k + '.html', text: k}));
    else if(/^audio-(ghazal|nazm)-\d{1,3}$/.test(k)) td.appendChild(el('a', {href: 'audios.html#' + k.slice(6), text: k}));
    else td.textContent = k;
    return td;
  }
  function table(title, hint, heads, data){
    var c = el('div', {class:'card'}); c.appendChild(el('h2', {text: title})); if(hint) c.appendChild(el('p', {class:'sub', text: hint}));
    if(!data.length){ c.appendChild(el('p', {class:'msg', text:'Abhi is period me kuch nahi.'})); return c; }
    var t = el('table'), hr = el('tr');
    heads.forEach(function(h, i){ hr.appendChild(el('th', {class: i ? 'n' : '', text: h})); }); t.appendChild(el('thead', {}, [hr]));
    var tb = el('tbody');
    data.forEach(function(r){ var tr = el('tr'); r.forEach(function(v, i){ if(i === 0) tr.appendChild(keyCell(String(v))); else tr.appendChild(el('td', {class:'n', text: String(v)})); }); tb.appendChild(tr); });
    t.appendChild(tb); c.appendChild(t); return c;
  }

  function render(){
    app.innerHTML = '';
    var topRow = el('div', {class:'row', style:'justify-content:space-between'});
    topRow.appendChild(el('span', {class:'who', text: ADMIN + (loadedAt ? '  ·  ' + loadedAt.toLocaleTimeString() : '')}));
    var right = el('div', {class:'row'});
    var rb = el('button', {type:'button', text:'Refresh'}); rb.addEventListener('click', reload);
    var lb = el('button', {type:'button', text:'Logout'}); lb.addEventListener('click', function(){ session = null; saveSess(null); showLogin(); });
    right.appendChild(rb); right.appendChild(lb); topRow.appendChild(right); app.appendChild(topRow);

    if(tableMissing){
      var c = el('div', {class:'card'});
      c.appendChild(el('p', {class:'err', text:'Table abhi bani nahi hai.'}));
      c.appendChild(el('p', {class:'msg', text:'Supabase → SQL Editor me tools-DO-NOT-UPLOAD/supabase-insights.sql ka poora text paste karke Run karo, phir yahan Refresh dabao.'}));
      app.appendChild(c); return;
    }
    var tabs = el('div', {class:'tabs'});
    [[7,'7 din'],[30,'30 din'],[90,'90 din'],[0,'Sab']].forEach(function(t){
      var b = el('button', {type:'button', text:t[1], 'aria-pressed': days === t[0] ? 'true' : 'false'});
      b.addEventListener('click', function(){ days = t[0]; reload(); }); tabs.appendChild(b);
    });
    app.appendChild(tabs);
    if(!rows.length){ app.appendChild(el('div', {class:'card'}, [el('p', {class:'msg', text:'Is period me abhi koi data nahi aaya. Site par kuch din log aane do, phir dekhna.'})])); app.appendChild(footer()); return; }

    var kinds = {}, langs = {}, perDay = {};
    rows.forEach(function(r){ kinds[r.kind] = (kinds[r.kind] || 0) + 1; langs[r.lang || '-'] = (langs[r.lang || '-'] || 0) + 1; var d = String(r.created_at).slice(0, 10); perDay[d] = (perDay[d] || 0) + 1; });
    var kp = el('div', {class:'kpis'});
    function kpi(label, v){ kp.appendChild(el('div', {class:'kpi'}, [el('b', {text: String(v)}), el('span', {text: label})])); }
    kpi('Total gintiyan', rows.length); kpi('Audio chalaye', kinds.audio_play || 0); kpi('Photo card', kinds.photocard || 0);
    kpi('Share / download / copy', (kinds.share || 0) + (kinds.download || 0) + (kinds.copy || 0)); kpi('Pasand (fav)', kinds.fav || 0); kpi('Search me kuch nahi mila', kinds.search_miss || 0);
    app.appendChild(kp);

    var cd = el('div', {class:'card'}); cd.appendChild(el('h2', {text:'Din ke hisaab se'}));
    var dayKeys = Object.keys(perDay).sort(), max = Math.max.apply(null, dayKeys.map(function(k){ return perDay[k]; })), bar = el('div', {class:'bar'});
    dayKeys.slice(-60).forEach(function(k){ var i = el('i', {title: k + ': ' + perDay[k]}); i.style.height = Math.max(4, Math.round(100 * perDay[k] / max)) + '%'; bar.appendChild(i); });
    cd.appendChild(bar);
    var lt = ['hi','en','ur','-'].filter(function(l){ return langs[l]; }).map(function(l){ return (l === '-' ? 'unknown' : l) + ' ' + Math.round(100 * langs[l] / rows.length) + '%'; }).join('   ·   ');
    cd.appendChild(el('p', {class:'note', text:'Bhasha: ' + lt})); app.appendChild(cd);

    /* poems */
    var sh = count('share'), dl = count('download'), cp = count('copy'), fv = count('fav'), all = {};
    [sh, dl, cp, fv].forEach(function(m){ Object.keys(m).forEach(function(k){ all[k] = 1; }); });
    var prow = Object.keys(all).map(function(k){ var s = sh[k] || 0, d = dl[k] || 0, c2 = cp[k] || 0, f = fv[k] || 0; return [k, s, d, c2, f, s + d + c2 + f]; }).sort(function(a, b){ return b[5] - a[5]; }).slice(0, 15);
    app.appendChild(table('Kaun si ghazal / nazm sabse zyada kaam aa rahi', 'Share, image download, text copy aur pasand — kitne alag visits me.', ['Rachna','Share','Image','Copy','Pasand','Kul'], prow));
    app.appendChild(table('Sabse zyada photo card bane sher', 'Sher ki pehli line (card par likha naam kabhi nahi liya jaata).', ['Sher','Visits'], top(count('photocard'), 12)));

    /* audio */
    var pl = count('audio_play'), dn = count('audio_done'), os = count('offline_save'), ak = {};
    [pl, dn, os].forEach(function(m){ Object.keys(m).forEach(function(k){ ak[k] = 1; }); });
    var arow = Object.keys(ak).map(function(k){ var p = pl[k] || 0, d = dn[k] || 0; return [k, p, d, p ? Math.round(100 * d / p) + '%' : '-', os[k] || 0]; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 20);
    app.appendChild(table('Audio', '“Poora suna” = audio aakhir tak chala. Offline = kitno ne save kiya.', ['Audio','Chala','Poora suna','Poora %','Offline save'], arow));

    /* searches */
    app.appendChild(table('Search me jo nahi mila', 'Log ye dhundh rahe the par koi nateeja nahi aaya — naye likhne ke liye idea, ya spelling jo samajh nahi aayi.', ['Search','Visits'], top(count('search_miss'), 20)));

    /* quiz */
    var qz = rows.filter(function(r){ return r.kind === 'quiz_done'; }), sum = 0, n = 0, dist = {};
    qz.forEach(function(r){ var m = /^(\d+)\/(\d+)$/.exec(r.key); if(m){ sum += +m[1] / +m[2]; n++; dist[m[1] + '/' + m[2]] = (dist[m[1] + '/' + m[2]] || 0) + 1; } });
    app.appendChild(table('Lafz quiz', n ? ('Kul ' + n + ' quiz, ausat ' + Math.round(100 * sum / n) + '% sahi.') : 'Abhi kisi ne quiz poora nahi kiya.', ['Score','Visits'], top(dist, 11)));
    app.appendChild(footer());
  }
  function footer(){
    var c = el('div', {class:'card'});
    c.appendChild(el('p', {class:'note', text:'Purana data hatana ho to (jagah bachane ke liye):'}));
    var b = el('button', {type:'button', class:'bad', text:'180 din se purana data delete karo'});
    b.addEventListener('click', function(){
      if(!confirm('180 din se purani saari gintiyan hamesha ke liye delete karni hain?')) return;
      b.disabled = true;
      ensureFresh().then(function(){ return authFetch('/rest/v1/zf_events?created_at=lt.' + encodeURIComponent(new Date(Date.now() - 180 * 86400000).toISOString()) + '&select=id', {method:'DELETE', headers:{'Prefer':'return=representation'}}); })
        .then(function(r){ if(!r.ok) throw new Error('del'); return r.json(); })
        .then(function(d){ alert(d.length + ' purani gintiyan delete ho gayi.'); reload(); })
        .catch(function(){ b.disabled = false; alert('Nahi ho paya. Refresh karke fir koshish karo.'); });
    });
    c.appendChild(b); return c;
  }

  session = fromHash() || loadSess();
  if(fromHash && session) saveSess(session);
  if(session) reload(); else showLogin();
})();
</script>
</body>
</html>
